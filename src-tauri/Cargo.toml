[package]
name = "pc-health"
version = "0.1.0"
description = "Local-first PC health monitoring agent"
authors = ["you"]
edition = "2021"

[lib]
name = "pc_health_ai_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
dirs = "6"
tauri-plugin-opener = "2.7.2"
